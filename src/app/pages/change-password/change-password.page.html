<ion-content>
  <div class="center">
    <form class="card box" (ngSubmit)="save()">
      <div class="icon"><app-icon name="lock"></app-icon></div>
      <h1>{{ forced ? 'Crea tu contraseña' : 'Cambiar contraseña' }}</h1>
      <p class="muted">{{ forced ? 'Por seguridad, reemplaza la contraseña temporal antes de continuar.' : 'Escribe tu contraseña actual y la nueva.' }}</p>

      <div class="field">
        <label for="cp-cur">{{ forced ? 'Contraseña temporal' : 'Contraseña actual' }}</label>
        <input id="cp-cur" name="current" class="input" type="password" [(ngModel)]="current" autocomplete="current-password" />
      </div>
      <div class="field">
        <label for="cp-new">Nueva contraseña</label>
        <input id="cp-new" name="next" class="input" type="password" [(ngModel)]="next" autocomplete="new-password" />
      </div>
      <div class="field">
        <label for="cp-conf">Confírmala</label>
        <input id="cp-conf" name="confirm" class="input" type="password" [(ngModel)]="confirm" autocomplete="new-password" />
      </div>
      <ul class="checks">
        <li *ngFor="let c of checks" [class.ok]="c.ok"><app-icon [name]="c.ok ? 'check' : 'minus'"></app-icon>{{ c.text }}</li>
      </ul>
      <div class="form-error" *ngIf="error">{{ error }}</div>
      <button class="btn btn-primary btn-lg btn-block" type="submit" [disabled]="loading">{{ loading ? 'Guardando…' : 'Guardar contraseña' }}</button>
      <button class="btn btn-ghost btn-block" type="button" *ngIf="forced" (click)="exit()">Salir</button>
      <a class="btn btn-ghost btn-block" routerLink="/profile" *ngIf="!forced">Volver</a>
    </form>
  </div>
</ion-content>
